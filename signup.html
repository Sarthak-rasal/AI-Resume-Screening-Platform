{% extends "base.html" %}{% block title %}Sign up{% endblock %}{% block content %}
<div class="card auth"><h2>Create your account</h2><p class="muted">Choose the portal that fits you.</p><form method="post">
<label>Full name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (min 6 characters)</label><input type="password" name="password" minlength="6" required>
<label>I am a</label><select name="role"><option value="candidate">Candidate: analyze my resume</option><option value="hr">HR / Recruiter: screen candidates</option></select>
<button style="width:100%">Sign up</button></form></div>
{% endblock %}
